<div style="background: #15191E; color: #F4F5F7; display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 16px">

<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px">Custo3D</span>

<div style="display: flex; gap: 2px">
<button type="button" aria-label="Manter sempre no topo" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FDBA74; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4z"></path></svg></button>
<button type="button" aria-label="Fechar" style="width: 44px; height: 44px; border: 0; background: transparent; color: #C9CED6; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>

<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #166534"><span style="width: 7px; height: 7px; border-radius: 50%; background: #16A34A; display: inline-block" aria-hidden="true"></span>Novo projeto</span>

<span style="font-size: 13px; color: #4B5563">Placa 1 · PLA Basic · Preto</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: #F6F7F9; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #4B5563">Filamento</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600">48,6 g</span>
</div>
<div style="background: #F6F7F9; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #4B5563">Tempo</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600">2h 14min</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<label for="w-kg" style="color: #374151">Filamento R$/kg</label>
<input id="w-kg" type="text" value="120,00" style="width: 110px; height: 40px; box-sizing: border-box; border: 1px solid #B8BFC8; border-radius: 8px; padding: 0 10px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 15px">
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<label for="w-bag" style="color: #374151">Sacolinha R$</label>
<input id="w-bag" type="text" value="0,35" style="width: 110px; height: 40px; box-sizing: border-box; border: 1px solid #B8BFC8; border-radius: 8px; padding: 0 10px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 15px">
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<label for="w-m" style="color: #374151">Lucro %</label>
<input id="w-m" type="text" value="150" style="width: 110px; height: 40px; box-sizing: border-box; border: 1px solid #B8BFC8; border-radius: 8px; padding: 0 10px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 15px">
</div>
</div>

<div style="margin-top: auto; background: #15191E; color: #F4F5F7; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #C9CED6"><span>Custo</span><span style="font-family: 'IBM Plex Mono', monospace">R$ 6,18</span></div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #FDBA74">Vender por</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 700; line-height: 1">R$ 15,46</span>
</div>
</div>

<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 8px; border: 1px solid #B8BFC8; color: #15191E; text-decoration: none; font-weight: 600; font-size: 14px">Abrir detalhes</a>
